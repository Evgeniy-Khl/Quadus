<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Квадус - Перемикачі</title>
  <style>
    html { font-family: Arial, sans-serif; display: inline-block; text-align: center; }
    h1, h4 { color: white; margin: 10px; }
    #grad1 {
      min-height: 100vh;
      background-image: linear-gradient(to bottom right, #2c3e50, #000000);
      padding: 20px;
      box-sizing: border-box;
    }
    .button {
      display: inline-block; background-color: #34495e; border: none; border-radius: 4px;
      color: white; padding: 15px 30px; text-decoration: none; font-size: 1.2rem;
      margin: 20px; cursor: pointer; transition: 0.3s; width: 80%; max-width: 300px;
    }
    .button:hover { background-color: #2c3e50; }
    .button-reset { background-color: #e67e22; }
    .button-reset:hover { background-color: #d35400; }

    .switch-container {
      background: rgba(255,255,255,0.1);
      padding: 15px; border-radius: 10px; margin: 10px auto;
      max-width: 400px; display: flex; justify-content: space-between; align-items: center;
    }
    
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #2ecc71; }
    input:focus + .slider { box-shadow: 0 0 1px #2ecc71; }
    input:checked + .slider:before { transform: translateX(26px); }

    .manual-indicator {
        color: #e67e22; font-weight: bold; margin-bottom: 15px; display: none;
    }
    .manual-indicator.active { display: block; }
  </style>
</head>
<body>
  <div id="grad1">
    <h1>Ручне управління</h1>
    <div id="manualMsg" class="manual-indicator">УВАГА: Ручний режим активований</div>
    
    <div class="switch-container">
        <h4>ОСВІТЛЕННЯ</h4>
        <label class="switch"><input type="checkbox" id="rel1" onchange="toggleRelay('rel1', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="switch-container">
        <h4>НАГРІВАЧ</h4>
        <label class="switch"><input type="checkbox" id="rel2" onchange="toggleRelay('rel2', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="switch-container">
        <h4>ЗВОЛОЖУВАЧ</h4>
        <label class="switch"><input type="checkbox" id="rel3" onchange="toggleRelay('rel3', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="switch-container">
        <h4>РЕЛЕ 1</h4>
        <label class="switch"><input type="checkbox" id="rel4" onchange="toggleRelay('rel4', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="switch-container">
        <h4>РЕЛЕ 2</h4>
        <label class="switch"><input type="checkbox" id="rel5" onchange="toggleRelay('rel5', this.checked)"><span class="slider"></span></label>
    </div>
    <div class="switch-container">
        <h4>РЕЛЕ 3</h4>
        <label class="switch"><input type="checkbox" id="rel6" onchange="toggleRelay('rel6', this.checked)"><span class="slider"></span></label>
    </div>

    <button class="button button-reset" onclick="resetAuto()">ПОВЕРНУТИ АВТОМАТИКУ</button>
    <br>
    <a href="/"><button class="button">НА ГОЛОВНУ</button></a>
  </div>

<script>
    function updateUI() {
        fetch('/get_relays')
            .then(response => response.json())
            .then(data => {
                document.getElementById('rel1').checked = data.rel1;
                document.getElementById('rel2').checked = data.rel2;
                document.getElementById('rel3').checked = data.rel3;
                document.getElementById('rel4').checked = data.rel4;
                document.getElementById('rel5').checked = data.rel5;
                document.getElementById('rel6').checked = data.rel6;
                
                const msg = document.getElementById('manualMsg');
                if (data.manual) msg.classList.add('active');
                else msg.classList.remove('active');
            });
    }

    function toggleRelay(id, state) {
        const payload = {};
        payload[id] = state;
        
        fetch('/set_relay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'ok') updateUI();
        });
    }

    function resetAuto() {
        fetch('/reset_auto', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'ok') updateUI();
        });
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', updateUI);
    // Refresh every 5 seconds
    setInterval(updateUI, 5000);
</script>
</body>
</html>
