<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Квадус - Головна</title>
  <style>
    html { font-family: Arial, sans-serif; display: inline-block; text-align: center; }
    h1 { color: white; margin: 20px 0; }
    #grad1 {
      min-height: 100vh;
      background-image: linear-gradient(to bottom right, #2c3e50, #000000);
      padding: 20px;
      box-sizing: border-box;
    }
    
    .sensor-block {
      border-radius: 15px;
      padding: 15px;
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      background: rgba(255,255,255,0.1);
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
    }
    
    .temp-val { font-size: 2.5rem; font-weight: bold; }
    .temp-set { font-size: 1.2rem; opacity: 0.8; margin-left: 10px; }
    .sensor-label { font-size: 1.1rem; display: block; margin-bottom: 5px; opacity: 0.9; }

    .status-container {
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      margin: 20px auto;
      text-align: left;
      color: white;
    }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 5px;
    }

    #ledsTable {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      border-spacing: 10px;
    }
    #ledsTable td {
      border-radius: 50%;
      width: 40px;
      height: 40px;
      text-align: center;
      background-color: #34495e;
      font-size: 1.5rem;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
      transition: 0.3s;
    }

    .button {
      display: inline-block; background-color: #34495e; border: none; border-radius: 8px;
      color: white; padding: 15px 30px; text-decoration: none; font-size: 1.1rem;
      margin: 10px; cursor: pointer; transition: 0.3s; width: 80%; max-width: 300px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .button:hover { background-color: #2c3e50; transform: translateY(-2px); }
    .button:active { transform: translateY(0); }
    .button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Состояния цветов */
    .bg-normal { background: rgba(46, 204, 113, 0.2); border: 1px solid rgba(46, 204, 113, 0.4); }
    .bg-humidity { background: rgba(52, 152, 219, 0.2); border: 1px solid rgba(52, 152, 219, 0.4); }
    .bg-error { background: rgba(231, 76, 60, 0.4); border: 1px solid #e74c3c; }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(230, 126, 34, 0); }
      100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); }
    }
    .bg-alarm { background: rgba(230, 126, 34, 0.4); border: 1px solid #e67e22; animation: pulse 2s infinite; }

    .error-msg {
      background: rgba(231, 76, 60, 0.2);
      border-left: 4px solid #e74c3c;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #ff9f94;
      border-radius: 4px;
      text-align: left;
    }

    .ukraine-flag { width: 30px; vertical-align: middle; margin-left: 10px; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="grad1">
    <h1>Квадус <img src="https://upload.wikimedia.org/wikipedia/commons/4/49/Flag_of_Ukraine.svg" class="ukraine-flag"></h1>
    <h3 id="model" style="color: #bdc3c7;">Завантаження...</h3>

    <div id="rcorners0" class="sensor-block">
      <span class="sensor-label">Температура №1</span>
      <span class="temp-val" id="temperature0">--</span><span class="units" style="font-size: 1.5rem;">&deg;C</span>
      <span class="temp-set" id="settemp0">[--]</span>
    </div>

    <div id="rcorners1" class="sensor-block">
      <span class="sensor-label">Температура №2</span>
      <span class="temp-val" id="temperature1">--</span><span class="units" style="font-size: 1.5rem;">&deg;C</span>
      <span class="temp-set" id="settemp1">[--]</span>
    </div>

    <div id="rcorners2" class="sensor-block">
      <span class="sensor-label" id="humidity-label">Вологість</span>
      <span class="temp-val" id="humidity">--</span><span class="units" style="font-size: 1.5rem;">%</span>
      <span class="temp-set" id="sethum">[--]</span>
    </div>

    <table id="ledsTable">
      <tr>
        <td id="led0" title="Освітление">&#128161;</td>
        <td id="led1" title="Обогрів">&#127774;</td>
        <td id="led2" title="Зволоження">&#128167;</td>
        <td id="led3" title="Реле 1">&#9200;</td>
        <td id="led4" title="Реле 2">&#9200;</td>
        <td id="led5" title="Реле 3">&#9200;</td>
        <td id="led6" title="Тривога">&#128680;</td>
      </tr>
    </table>

    <div class="status-container">
      <div id="error-list" style="display: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; margin-bottom: 10px;"></div>
      <div class="status-row"><span>Освітлення:</span> <span id="light">--</span></div>
      <div class="status-row"><span>Реле 1:</span> <span id="timer1">--</span></div>
      <div class="status-row"><span>Реле 2:</span> <span id="timer2">--</span></div>
      <div class="status-row"><span>Реле 3:</span> <span id="timer3">--</span></div>
      <div class="status-row"><span>Заслінка:</span> <span id="flap">-- %</span></div>
      <div class="status-row"><span>Програма:</span> <span id="program">--</span></div>
      <div class="status-row" style="border:none; margin-top:10px; font-size:0.9rem; opacity:0.7;">
        <span>Дата:</span> <span id="currDay">--</span>
      </div>
    </div>

    <p><a href="/setup"><button class="button">Налаштування</button></a></p>
    <p><a href="/switch"><button class="button" style="background-color: #2980b9;">Перемикачі</button></a></p>
    <p><button class="button" style="background-color: #7f8c8d;" onclick="window.location.href='/view_logs'">Логи</button></p>
    <p><a id="programLink" href="/table"><button id="programButton" class="button" disabled>Програма</button></a></p>
  </div>

<script>
function fetchData() {
    fetch("/getvalues")
        .then(response => response.json())
        .then(json => {
            document.getElementById("model").innerHTML = json.model;
            
            const e = json.errorsFlag || 0;

            // Temperature 0 / DHT22 Temp
            if (e & 0x41) { // ERROR1 (0x01) or DHT_ERR (0x40)
                document.getElementById("temperature0").innerHTML = "ПОМИЛКА";
                document.querySelector("#rcorners0 .units").style.display = 'none';
            } else {
                document.getElementById("temperature0").innerHTML = json.temperature0;
                document.querySelector("#rcorners0 .units").style.display = 'inline';
            }
            document.getElementById("settemp0").innerHTML = json.settemp0;
            
            // Logic for block colors
            const updateBlockColor = (id, err, alarm, defaultClass) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.className = 'sensor-block ' + defaultClass;
                if (err) el.classList.add('bg-error');
                else if (alarm) el.classList.add('bg-alarm');
            };
            
            updateBlockColor("rcorners0", e & 0x41, e & 0x14, "bg-normal"); // alarm: ERROR4(0x04) or ERROR10(0x10)

            if (json.temperature1 !== undefined) {
                document.getElementById("rcorners1").style.display = 'block';
                if (e & 0x02) { // ERROR2
                    document.getElementById("temperature1").innerHTML = "ПОМИЛКА";
                    document.querySelector("#rcorners1 .units").style.display = 'none';
                } else {
                    document.getElementById("temperature1").innerHTML = json.temperature1;
                    document.querySelector("#rcorners1 .units").style.display = 'inline';
                }
                document.getElementById("settemp1").innerHTML = json.settemp1;
                updateBlockColor("rcorners1", e & 0x02, e & 0x28, "bg-normal"); // alarm: ERROR8(0x08) or ERROR20(0x20)
            } else {
                document.getElementById("rcorners1").style.display = 'none';
            }

            if (json.humidity !== undefined) {
                document.getElementById("rcorners2").style.display = 'block';
                if (e & 0x42) { // ERROR2 (0x02) or DHT_ERR (0x40)
                    document.getElementById("humidity").innerHTML = "ПОМИЛКА";
                    document.querySelector("#rcorners2 .units").style.display = 'none';
                } else {
                    document.getElementById("humidity").innerHTML = json.humidity;
                    document.querySelector("#rcorners2 .units").style.display = 'inline';
                }
                document.getElementById("sethum").innerHTML = json.sethum;
                document.getElementById("sethum").style.display = json.isTableRH ? 'none' : 'inline';
                document.getElementById("humidity-label").innerHTML = json.isTableRH ? "Вологість (таблиця)" : "Вологість";
                updateBlockColor("rcorners2", e & 0x42, e & 0x28, "bg-humidity");
            } else {
                document.getElementById("rcorners2").style.display = 'none';
            }

            // Error messages list
            const errorLabels = [
                "Помилка датчика №1", // bit 0 (0x01)
                "Помилка датчика №2", // bit 1 (0x02)
                "ТРИВОГА: Температура №1 поза межами!", // bit 2 (0x04)
                "ТРИВОГА: Температура №2 | Волога поза межами!", // bit 3 (0x08)
                "ТРИВОГА: Датчик №1 завис!", // bit 4 (0x10)
                "ТРИВОГА: Датчик №2 завис!", // bit 5 (0x20)
                "ПОМИЛКА: Датчик DHT22 не відповідає!", // bit 6 (0x40)
                "Невідома помилка!" // bit 7 (0x80)
            ];

            const errorList = document.getElementById("error-list");
            errorList.innerHTML = "";
            let hasAnyError = false;
            for (let i = 0; i < 8; i++) {
                if (e & (1 << i)) {
                    // Skip range alarms if the sensor is disconnected or has a read error
                    if (i === 2 && (e & 0x41)) continue; // Skip T1 Alarm if Sensor1 Error or DHT Error
                    if (i === 3 && (e & 0x42)) continue; // Skip T2 Alarm if Sensor2 Error or DHT Error
                    
                    const div = document.createElement("div");
                    div.className = "error-msg";
                    div.innerText = errorLabels[i];
                    errorList.appendChild(div);
                    hasAnyError = true;
                }
            }
            errorList.style.display = hasAnyError ? "block" : "none";

            document.getElementById("light").innerHTML = json.light;
            
            const relayModes = ["Допоміжний режим", "Ціло добово", "Тікі без освітлення", "Тікі з освітленням"];
            
            const formatRelayStatus = (mode, timerStr, isRelay3 = false) => {
                if (!timerStr) return '--';
                if (!isRelay3 && mode === 0) {
                    // For Relays 1 & 2 in mode 0, show auxiliary mode and only ON/OFF state
                    const state = timerStr.includes("ON") ? "↑ ON" : "↓ OFF";
                    return `[${relayModes[mode] || relayModes[0]}] ${state}`;
                }
                // For Relay 3 or other modes, show mode name and full timer info
                const label = (isRelay3 && mode === 0) ? "Ціло добово" : (relayModes[mode] || '--');
                const timeInfo = timerStr.split(' ').slice(1).join(' ') || timerStr;
                return `[${label}] ${timeInfo}`;
            };

            document.getElementById("timer1").innerHTML = formatRelayStatus(json.mR1, json.timer1);
            document.getElementById("timer2").innerHTML = formatRelayStatus(json.mR2, json.timer2);
            document.getElementById("timer3").innerHTML = formatRelayStatus(json.mR3, json.timer3, true);
            
            document.getElementById("flap").innerHTML = json.flap;
            document.getElementById("program").innerHTML = json.program;
            document.getElementById("currDay").innerHTML = json.currDay;

            // LEDs
            const setLed = (id, state, color) => {
                document.getElementById(id).style.backgroundColor = (state === "ON") ? color : "#34495e";
                document.getElementById(id).style.boxShadow = (state === "ON") ? `0 0 15px ${color}` : "inset 0 2px 5px rgba(0,0,0,0.5)";
            };

            setLed('led0', json.led0, "#f1c40f");
            setLed('led1', json.led1, "#f39c12");
            setLed('led2', json.led2, "#3498db");
            setLed('led3', json.led3, "#2ecc71");
            setLed('led4', json.led4, "#2ecc71");
            setLed('led5', json.led5, "#2ecc71");
            setLed('led6', json.led6, "#e74c3c");

            // Dynamic Icons based on Mode
            const updateRelayIcon = (id, mode, isRelay3 = false) => {
                const el = document.getElementById(id);
                if (isRelay3 || mode > 0) {
                    el.innerHTML = "&#9200;"; // Timer (Clock)
                    el.title = isRelay3 ? "Реле 3 (Таймер)" : `Реле ${id.slice(-1) - 2} (Таймер)`;
                } else {
                    el.innerHTML = "&#128736;"; // Helper (Tools)
                    el.title = `Реле ${id.slice(-1) - 2} (Допоміжний)`;
                }
            };

            updateRelayIcon('led3', json.mR1);
            updateRelayIcon('led4', json.mR2);
            updateRelayIcon('led5', json.mR3, true);
			
            const btn = document.getElementById("programButton");
            if (json.program === "none" || json.program === "немає") {
                btn.disabled = true;
                btn.innerText = "Програми немає";
            } else {
                btn.disabled = false;
                btn.innerText = "Програма " + json.program;
            }
        })
        .catch(err => console.error("Fetch error:", err));
}

document.addEventListener('DOMContentLoaded', () => {
    fetchData();
    setInterval(fetchData, 2000);
});
</script>
</body>
</html>
