<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humidity Display</title>
    <style>
        /* Ваши стили */
    </style>
</head>
<body>
    <p id="rcorners2">
        <span class="sensor-labels">Вологість</span><br/>
        <span style="font-size:2.0em; color:#000000" id="humidity">--</span>
        <sup style="font-size:1.3em; color:#000000" id="sethum">[--]</sup>
        <sup class="units">&#37;</sup>
    </p>

    <script>
        // Пример jsonResponse
        const jsonResponse = {
            // humidity: 50 // Раскомментируйте для теста
        };

        // Проверяем наличие humidity
        if (jsonResponse.humidity === undefined) {
            document.getElementById('rcorners2').style.display = 'none';
        } else {
            document.getElementById('humidity').innerText = jsonResponse.humidity;
            document.getElementById('sethum').innerText = `[${jsonResponse.humidity}]`;
        }
    </script>
</body>
</html>
